name: wvsu_wayfinder
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.41.0"

dependencies:
  file_picker: 10.3.10
  flutter:
    sdk: flutter
  flutter_local_notifications: 19.5.0
  flutter_map: ^8.3.2
  geolocator: ^14.0.2
  go_router: ^17.2.3
  google_mlkit_text_recognition: 0.15.1
  http: ^1.6.0
  image_picker: ^1.2.2
  latlong2: ^0.10.1
  pdfrx: 2.4.8
  shared_preferences: ^2.5.5
  timezone: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/wayfinder-logo.png
    - assets/demo/places.json
    - assets/demo/processes.json
    - assets/demo/campus.json
    - assets/demo/faculty.json
    - assets/demo/floorplan-cb-2.png
