name: health360
description: "Health360 - Healthcare for the Future. Patient mobile app (CC 207B Final Project)."
publish_to: "none"
version: 0.5.0+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cloud_firestore: ^7.2.0
  firebase_ai: ^5.2.0
  firebase_app_check: ^0.5.2
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  # DM Sans is the typeface used in the Health360 prototype.
  google_fonts: ^6.2.1
  # Small key-value storage: remembers which medication doses were taken today.
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
