name: Deploy Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meditech
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Push database migrations
        run: supabase db push --yes --remote

      - name: Set function secrets
        env:
          SUPABASE_FUNCTION_SECRETS: ${{ secrets.SUPABASE_FUNCTION_SECRETS }}
        run: |
          if [ -z "$SUPABASE_FUNCTION_SECRETS" ]; then
            echo "No extra function secrets (hosted functions already get SUPABASE_URL, ANON, and SERVICE_ROLE)."
            exit 0
          fi
          # Example secret value: KEY1=value1 KEY2=value2
          supabase secrets set --yes -- $SUPABASE_FUNCTION_SECRETS

      - name: Deploy edge functions
        run: supabase functions deploy --yes --remote
